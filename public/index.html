<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brasília Fighter — TikTok LIVE Edition</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="app">
 <div class="stage" id="stage">
  <img class="arena-art" src="/arena-reference.png" alt="Arte vertical da arena Brasília Fighter">
  <div class="hud-overlay">
   <div class="hp lula-hp"><span id="lula-bar"></span></div><div class="hp flavio-hp"><span id="flavio-bar"></span></div>
   <div class="hp-number lula-number" id="lula-hp">300</div><div class="hp-number flavio-number" id="flavio-hp">300</div>
   <div class="timer" id="timer">99</div><div class="hit-flash" id="flash"></div><div class="damage" id="damage"></div>
  </div>
  <div class="overlay-controls">
   <button class="rose-button red" id="red" aria-label="Simular rosa vermelha: golpe no Flávio"></button>
   <button class="rose-button white" id="white" aria-label="Simular rosa branca: golpe no Lula"></button>
   <button class="rose-button reset" id="reset" aria-label="Reiniciar rodada"></button>
  </div>
  <div class="status" id="status">CONECTANDO…</div><div class="ko" id="ko"></div>
 </div>
 <footer><span>BRASÍLIA FIGHTER · MODO TESTE</span><span id="last-action">Prepare-se para lutar!</span><span id="hits">GOLPES: 0</span></footer>
 <p class="note">Formato vertical 9:16 para captura no TikTok LIVE Studio. Teste o enquadramento antes de entrar ao vivo.</p>
</main><script src="/socket.io/socket.io.js"></script><script src="/game.js"></script></body></html>
